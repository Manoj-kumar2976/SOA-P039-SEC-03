server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**
        - id: policy-service
          uri: lb://policy-service
          predicates:
            - Path=/api/policy/**
        - id: claim-service
          uri: lb://claim-service
          predicates:
            - Path=/api/claims/**
        - id: settlement-service
          uri: lb://settlement-service
          predicates:
            - Path=/api/settlement/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
